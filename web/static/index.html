<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MNLP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M16 6l-8 3.5v5.2c0 4.8 3.4 9.3 8 10.3 4.6-1 8-5.5 8-10.3V9.5zm-1.8 13.4-3.4-3.4 1.2-1.2 2.2 2.2 5.4-5.4 1.2 1.2z' fill='white'/></svg>">
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="#/overview">
        <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5zm-2 16-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9z"/></svg></span>
        <span class="brand-name">MNLP</span>
      </a>

      <button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>

      <nav class="menu" id="menu">
        <a href="#/overview" data-route="overview" class="menu-link">Home</a>
        <a href="#/verify" data-route="verify" class="menu-link">Verify Claim</a>
        <div class="dropdown" id="data-dd">
          <button class="menu-link" id="data-btn" data-route="data" aria-haspopup="true" aria-expanded="false">
            Data Files
            <svg class="caret" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </button>
          <div class="dropdown-panel" id="file-nav"><div class="dd-empty">Loading…</div></div>
        </div>
        <a href="#/pipeline" data-route="pipeline" class="menu-link">Run Pipeline</a>
      </nav>

      <div class="nav-right">
        <button class="icon-btn" id="theme-toggle" title="Switch light / dark" aria-label="Switch light / dark">
          <svg class="i-sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4zM18.4 4.2l1.4 1.4-2.1 2.1-1.4-1.4zM6.3 16.3l1.4 1.4-2.1 2.1-1.4-1.4z"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div class="crumb" id="crumb"></div>
      <h1 id="page-title">Home</h1>
    </div>
    <div id="view" class="view"></div>
  </main>

  <footer class="footer">Myanmar NLP · Claim Verification &amp; Evidence Retrieval</footer>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">Row details</h3>
        <button class="icon-btn" id="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
